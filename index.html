<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f0f5ff;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .form-container {
        background: white;
        width: 100%;
        max-width: 430px;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }

      h1 {
        text-align: center;
        color: #234b87;
        font-size: 26px;
        margin: 0 0 8px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        font-size: 14px;
        margin-bottom: 25px;
      }

      .form-group {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        color: #333;
        font-weight: bold;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccd5e0;
        border-radius: 7px;
        font-size: 15px;
        outline: none;
        transition: 0.2s;
      }

      input:focus {
        border-color: #3976d2;
        box-shadow: 0 0 0 3px rgba(57, 118, 210, 0.12);
      }

      button {
        width: 100%;
        padding: 13px;
        background: #326bc0;
        color: white;
        border: none;
        border-radius: 7px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background 0.2s;
      }

      button:hover {
        background: #24549c;
      }

      #message {
        display: none;
        margin-top: 18px;
        padding: 12px;
        text-align: center;
        color: #176b3a;
        background: #e7f8ed;
        border-radius: 7px;
        font-size: 14px;
      }

      @media (max-width: 480px) {
        .form-container {
          padding: 22px;
        }
      }
    </style>
  </head>

  <body>
    <div class="form-container">
      <h1>Student Registration</h1>
      <p class="subtitle">Please fill in your details below</p>

      <form id="registrationForm">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="form-group">
          <label for="contact">Contact Number</label>
          <input
            type="tel"
            id="contact"
            name="contact"
            placeholder="Enter your 10-digit number"
            pattern="[0-9]{10}"
            maxlength="10"
            minlength="10"
            required
          />
        </div>

        <button type="submit">Submit Registration</button>
      </form>

      <div id="message" role="status" aria-live="polite">
        Registration submitted successfully!
      </div>
    </div>

    <script>
      const form = document.getElementById("registrationForm");
      const message = document.getElementById("message");

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        message.style.display = "block";
        form.reset();
      });
    </script>
  </body>
</html>
